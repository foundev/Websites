<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active {
      transform: scale(0.98);
      background: var(--card-hover);
    }

    .card-icon {
      font-size: 2rem;
      background: rgba(59, 130, 246, 0.15);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .status-ready {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .chevron {
      color: var(--text-muted);
      font-size: 1.2rem;
      font-weight: bold;
    }

    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Dashboard</h1>
      <p>Quick access to web utilities</p>
    </div>

    <!-- Navigation Card directly to or.html -->
    <a href="or.html" class="card">
      <div class="card-icon">⚡</div>
      <div class="card-info">
        <div class="card-title">
          OpenRouter Chat
          <span id="key-status" class="status-badge status-pending">Checking...</span>
        </div>
        <div class="card-desc">Direct interface with model selection & ZDR toggles.</div>
      </div>
      <span class="chevron">›</span>
    </a>

    <div class="footer-note">
      Host: GitHub Pages &bull; Storage: Local Device
    </div>
  </div>

  <script>
    // Check if the user already saved an API key on this domain
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('openrouter_api_key');
      const badge = document.getElementById('key-status');
      
      if (savedKey) {
        badge.textContent = 'Configured';
        badge.className = 'status-badge status-ready';
      } else {
        badge.textContent = 'Needs Key';
        badge.className = 'status-badge status-pending';
      }
    });
  </script>
</body>
</html>
