<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OpenRouter Client</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --user-msg: #2563eb;
      --bot-msg: #334155;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .controls-grid {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, select, textarea, button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active { background: var(--accent-hover); }

    .switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .switch-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #475569;
      border-radius: 24px;
      transition: .3s;
      cursor: pointer;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background-color: var(--success);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .assistant {
      align-self: flex-start;
      background: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    .system-banner {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
    }

    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 44px;
      max-height: 120px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <span class="title">OpenRouter Client</span>
      <button class="btn-icon" id="toggle-config" title="Settings">⚙️</button>
    </div>

    <div id="config-panel" class="controls-grid">
      <div class="row">
        <input type="password" id="api-key" placeholder="OpenRouter API Key (sk-or-...)" style="flex: 1;">
        <button id="save-key-btn">Save</button>
      </div>

      <div class="row">
        <select id="model-select" style="flex: 1;">
          <option value="">Load API key to fetch models...</option>
        </select>
        <button id="refresh-models-btn" title="Refresh Models">🔄</button>
      </div>

      <div class="switch-container">
        <span class="switch-label">Zero Data Retention (ZDR)</span>
        <label class="toggle">
          <input type="checkbox" id="zdr-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>

  <div id="chat-log"></div>

  <footer>
    <textarea id="prompt-input" placeholder="Type a message..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </footer>

  <script>
    const STORAGE_KEY = 'openrouter_api_key';
    const STORAGE_ZDR = 'openrouter_zdr';
    const STORAGE_MODEL = 'openrouter_model';

    const apiKeyInput = document.getElementById('api-key');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const modelSelect = document.getElementById('model-select');
    const refreshBtn = document.getElementById('refresh-models-btn');
    const zdrToggle = document.getElementById('zdr-toggle');
    const toggleConfigBtn = document.getElementById('toggle-config');
    const configPanel = document.getElementById('config-panel');
    const chatLog = document.getElementById('chat-log');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');

    let chatHistory = [];

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem(STORAGE_KEY);
      const savedZdr = localStorage.getItem(STORAGE_ZDR);
      
      if (savedKey) {
        apiKeyInput.value = savedKey;
        fetchModels(savedKey);
      }
      if (savedZdr !== null) {
        zdrToggle.checked = savedZdr === 'true';
      }
    });

    toggleConfigBtn.addEventListener('click', () => {
      configPanel.classList.toggle('hidden');
    });

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('Please enter a valid API key.');
      localStorage.setItem(STORAGE_KEY, key);
      fetchModels(key);
      alert('API key saved!');
    });

    zdrToggle.addEventListener('change', () => {
      localStorage.setItem(STORAGE_ZDR, zdrToggle.checked);
    });

    refreshBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key) fetchModels(key);
    });

    modelSelect.addEventListener('change', () => {
      localStorage.setItem(STORAGE_MODEL, modelSelect.value);
    });

    async function fetchModels(apiKey) {
      modelSelect.innerHTML = '<option>Loading models...</option>';
      try {
        const res = await fetch('https://openrouter.ai/api/v1/models', {
          headers: {
            'Authorization': `Bearer ${apiKey}`
          }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();
        
        data.sort((a, b) => a.id.localeCompare(b.id));

        modelSelect.innerHTML = '';
        const savedModel = localStorage.getItem(STORAGE_MODEL);

        data.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name || m.id;
          if (m.id === savedModel) opt.selected = true;
          modelSelect.appendChild(opt);
        });

        if (!modelSelect.value && data.length > 0) {
          modelSelect.selectedIndex = 0;
        }
      } catch (err) {
        modelSelect.innerHTML = '<option value="">Error loading models</option>';
        appendMessage('system-banner', `Failed to load models: ${err.message}`);
      }
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.textContent = text;
      chatLog.appendChild(msgDiv);
      chatLog.scrollTop = chatLog.scrollHeight;
      return msgDiv;
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const selectedModel = modelSelect.value;
      const isZdr = zdrToggle.checked;

      if (!apiKey) return alert('Please provide an API Key in settings.');
      if (!selectedModel) return alert('Please select a model.');
      if (!text) return;

      appendMessage('user', text);
      chatHistory.push({ role: 'user', content: text });
      promptInput.value = '';

      const assistantMsg = appendMessage('assistant', 'Thinking...');

      const payload = {
        model: selectedModel,
        messages: chatHistory
      };

      if (isZdr) {
        payload.provider = {
          zdr: true,
          data_collection: 'deny'
        };
      }

      try {
        // Only sending standard CORS-safe headers
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          const errDetail = data?.error?.message || `Error ${response.status}`;
          throw new Error(errDetail);
        }

        const reply = data.choices[0]?.message?.content || '[No response returned]';
        assistantMsg.textContent = reply;
        chatHistory.push({ role: 'assistant', content: reply });

      } catch (err) {
        assistantMsg.textContent = `⚠️ ${err.message}`;
        assistantMsg.classList.add('system-banner');
      }
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
